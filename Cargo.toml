[package]
name = "antenna-functions"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Wire antenna length calculations (dipole, off-center fed dipole, delta loop) as a Python module written in Rust"
readme = "README.md"
repository = "https://github.com/kamodev/antenna-functions"

[lib]
name = "antenna_functions"
# cdylib for the Python extension, rlib so the calculations can be used and tested from Rust.
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py39"] }
