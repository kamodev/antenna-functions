[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[project]
name = "antenna-functions"
version = "0.1.0"
description = "Wire antenna length calculations (dipole, off-center fed dipole, delta loop), implemented in Rust"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["antenna", "dipole", "ocf", "delta loop", "ham radio", "amateur radio"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Communications :: Ham Radio",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.maturin]
module-name = "antenna_functions"

[tool.pytest.ini_options]
testpaths = ["tests"]
